name: Book JSON tests

on:
  pull_request:
    paths:
      - "bookjson.pas"
      - "tests/bookjson_tests.pas"
      - ".github/workflows/bookjson-tests.yml"
  push:
    branches:
      - feature/novel-reader-importer
    paths:
      - "bookjson.pas"
      - "tests/bookjson_tests.pas"
      - ".github/workflows/bookjson-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fp-compiler fp-units-fcl
          fpc -iV

      - name: Compile book JSON tests
        run: fpc -Fu. tests/bookjson_tests.pas

      - name: Run book JSON tests
        run: ./tests/bookjson_tests
